name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Pin npm for reproducible packages
        run: npm install --global npm@11.19.1 --registry=https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Run tests
        run: bun test
      - name: Build and verify release archives
        run: npm run release:pack
      - name: Save installable archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: |
            release/*.tgz
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
