<svg xmlns="http://www.w3.org/2000/svg" width="940" height="328" viewBox="0 0 940 328" role="img" aria-labelledby="title description">
  <title id="title">Context usage panel illustration</title>
  <desc id="description">Illustration, not a runtime screenshot. A Context panel shows 40% used. The overview bar contains 16 used cells, 5 reserved cells and 19 free cells, representing 80K used, 24K reserved and 96K free within a 200K context window. The composition bar contains 24 cached cells, 12 prompt cells, 3 thinking cells and 1 output cell, representing 48K cached, 24K prompt, 6K thinking and 2K output tokens. Two legend groups follow both bars. Colours are an example theme; output is fixed bright yellow.</desc>
  <rect width="940" height="328" rx="14" fill="#0d1117"/>
  <rect x="28" y="28" width="572" height="252" rx="5" fill="#161b22" stroke="#484f58"/>
  <g font-family="'Cascadia Mono', 'DejaVu Sans Mono', Consolas, monospace">
    <text x="54" y="70" fill="#e6edf3" font-size="23" font-weight="600">Context</text>
    <text x="574" y="70" text-anchor="end" fill="#f5a76b" font-size="20">40% used</text>

    <!-- Forty terminal cells: overview 16 / 5 / 19, composition 24 / 12 / 3 / 1. -->
    <g font-size="24">
      <text x="54" y="116" textLength="208" lengthAdjust="spacingAndGlyphs" fill="#f5a76b">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>
      <text x="262" y="116" textLength="65" lengthAdjust="spacingAndGlyphs" fill="#9aa7b5">▓▓▓▓▓</text>
      <text x="327" y="116" textLength="247" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">░░░░░░░░░░░░░░░░░░░</text>
      <text x="54" y="158" textLength="312" lengthAdjust="spacingAndGlyphs" fill="#7bc88c">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>
      <text x="366" y="158" textLength="156" lengthAdjust="spacingAndGlyphs" fill="#d99cdb">▓▓▓▓▓▓▓▓▓▓▓▓</text>
      <text x="522" y="158" textLength="39" lengthAdjust="spacingAndGlyphs" fill="#73a9ed">▓▓▓</text>
      <text x="561" y="158" textLength="13" lengthAdjust="spacingAndGlyphs" fill="#ffff00">▓</text>
    </g>

    <g font-size="18">
      <text x="54" y="207"><tspan fill="#f5a76b">▓ u </tspan><tspan fill="#9aa7b5">80K</tspan></text>
      <text x="206" y="207"><tspan fill="#9aa7b5">▓ r 24K</tspan></text>
      <text x="358" y="207"><tspan fill="#e6edf3">░ f </tspan><tspan fill="#9aa7b5">96K</tspan></text>
      <text x="54" y="249"><tspan fill="#7bc88c">▓ c </tspan><tspan fill="#9aa7b5">48K</tspan></text>
      <text x="186" y="249"><tspan fill="#d99cdb">▓ p </tspan><tspan fill="#9aa7b5">24K</tspan></text>
      <text x="318" y="249"><tspan fill="#73a9ed">▓ t </tspan><tspan fill="#9aa7b5">6K</tspan></text>
      <text x="450" y="249"><tspan fill="#ffff00">▓ o </tspan><tspan fill="#9aa7b5">2K</tspan></text>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <path d="M614 109h18" stroke="#484f58" stroke-width="1.5"/>
    <text x="646" y="108" fill="#e6edf3" font-size="17" font-weight="600">Overview</text>
    <text x="646" y="130" fill="#9aa7b5" font-size="15">Share of the 200K context window</text>
    <path d="M614 151h18" stroke="#484f58" stroke-width="1.5"/>
    <text x="646" y="150" fill="#e6edf3" font-size="17" font-weight="600">Composition</text>
    <text x="646" y="172" fill="#9aa7b5" font-size="15">Breakdown of the 80K used tokens</text>
    <text x="30" y="310" fill="#9aa7b5" font-size="13">Illustration · example theme and token counts</text>
  </g>
</svg>
