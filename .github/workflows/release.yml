name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Validate the version tag
        id: meta
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'opencode-tui-context') throw new Error('Unexpected package name');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('This workflow publishes stable x.y.z versions only');
          }
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('The tag must exactly match v + package.json version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Pin npm for reproducible packages
        run: npm install --global npm@11.19.1 --registry=https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Run tests
        run: bun test
      - name: Build and verify release archives
        run: npm run release:pack
      - name: Save the exact release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.tgz
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  npm:
    name: Publish the verified npm archive
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.19.1 --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ubuntu-latest
          path: release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Check whether this exact package is already published
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const name = 'opencode-tui-context';
          const archive = readFileSync(`release/${name}-${version}.tgz`);
          const integrity = `sha512-${createHash('sha512').update(archive).digest('base64')}`;
          const response = await fetch(`https://registry.npmjs.org/${name}/${version}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else if (response.ok) {
            const published = await response.json();
            if (published.name !== name || published.version !== version || published.dist?.integrity !== integrity) {
              throw new Error('This npm version exists with different contents. Release a new version; do not overwrite it.');
            }
            console.log('The exact archive is already published; continuing with GitHub Release.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          } else {
            throw new Error(`Registry lookup failed (${response.status}); refusing to publish.`);
          }
          NODE
      - name: Publish to npm using OIDC
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "release/opencode-tui-context-${RELEASE_VERSION}.tgz" --access public --tag latest --ignore-scripts --registry=https://registry.npmjs.org

  github-release:
    name: Publish GitHub Release downloads
    needs: [package, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ubuntu-latest
          path: release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create or finish the release
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          mkdir -p existing-assets
          for archive in release/*; do
            asset_name="$(basename "$archive")"
            if printf '%s\n' "$existing_assets" | grep -Fxq "$asset_name"; then
              gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir existing-assets
              cmp "$archive" "existing-assets/$asset_name"
            else
              gh release upload "$RELEASE_TAG" "$archive"
            fi
          done

          gh release edit "$RELEASE_TAG" --draft=false
